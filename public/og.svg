<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="McLaren P1 real-time 3D experience">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#161008"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#ffb27a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#ff6a1f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- stylised hypercar silhouette -->
  <g transform="translate(120,330)">
    <path d="M40 90 C120 40, 300 30, 470 34 C620 38, 760 60, 860 90 L880 120 L30 120 Z"
          fill="#0f0f13" stroke="url(#ember)" stroke-width="4"/>
    <path d="M300 40 C380 18, 470 16, 560 40 C600 52, 620 70, 640 84 L280 84 Z"
          fill="none" stroke="#ff6a1f" stroke-width="2.5" opacity="0.5"/>
    <circle cx="230" cy="120" r="52" fill="#08080a" stroke="#c9c9d1" stroke-width="5"/>
    <circle cx="690" cy="120" r="52" fill="#08080a" stroke="#c9c9d1" stroke-width="5"/>
    <rect x="846" y="70" width="16" height="12" rx="3" fill="#ffd9a0"/>
    <rect x="28" y="74" width="16" height="12" rx="3" fill="#ff3b12"/>
  </g>
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="18" fill="#f4f4f5">McLAREN</text>
  <text x="84" y="200" font-family="Arial, sans-serif" font-size="30" letter-spacing="8" fill="#ff6a1f">P1 — REAL-TIME 3D EXPERIENCE</text>
  <text x="80" y="560" font-family="Arial, sans-serif" font-size="24" letter-spacing="2" fill="#8b8b94">An independent real-time 3D automotive experience — model by vecarz (CC-BY 4.0), not affiliated with McLaren.</text>
</svg>
